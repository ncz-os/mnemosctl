# cargo-deny config for the ncz-os Rust quality gate. Schema v2.
[advisories]
version = 2
# No ignore entries are in use: every advisory reported by `cargo deny check`
# is resolved by a dependency upgrade in Cargo.lock. If an advisory ever has no
# available fix, add a scoped entry here instead of disabling the check:
#   { id = "RUSTSEC-YYYY-NNNN", crate = "name", reason = "...", text = "...",
#     review-by = "YYYY-MM-DD" }
# with the reason limited to a neutral statement of why this project is not
# affected, plus a review-by date.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Unicode-DFS-2016", "Zlib",
  "MPL-2.0", "CC0-1.0", "0BSD", "CDLA-Permissive-2.0", "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
